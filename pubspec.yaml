name: boilerplate
description: 플러터 웹
version: 1.0.0+1

environment:
  sdk: '>3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  get: ^4.6.6
  flutter_screenutil: ^5.9.0
  permission_handler: ^11.0.1
  url_launcher: ^6.1.11
  flutter_svg: ^2.0.7
  intl: ^0.19.0
  easy_sidemenu: ^0.6.0
  dropdown_button2: ^2.3.9
  url_strategy: ^0.2.0
  multi_dropdown: ^2.1.4
  dio: ^5.5.0+1
  http: ^1.2.2
  fl_chart: ^0.63.0
  firebase_core: ^3.8.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.1.0
  icons_launcher: ^2.1.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/logo/
    - assets/images/
    - assets/geojson/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/Inter-Thin.ttf
          weight: 100
        - asset: assets/font/Inter-Light.ttf
          weight: 300
        - asset: assets/font/Inter-Regular.ttf
          weight: 400
        - asset: assets/font/Inter-Medium.ttf
          weight: 500
        - asset: assets/font/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/font/Inter-Bold.ttf
          weight: 700
        - asset: assets/font/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Inter-Black.ttf
          weight: 900
    - family: Gothic
      fonts:
        - asset: assets/font/GothicA1-Thin.ttf
          weight: 100
        - asset: assets/font/GothicA1-Light.ttf
          weight: 300
        - asset: assets/font/GothicA1-Regular.ttf
          weight: 400
        - asset: assets/font/GothicA1-Medium.ttf
          weight: 500
        - asset: assets/font/GothicA1-SemiBold.ttf
          weight: 600
        - asset: assets/font/GothicA1-Bold.ttf
          weight: 700
        - asset: assets/font/GothicA1-ExtraBold.ttf
          weight: 800
        - asset: assets/font/GothicA1-Black.ttf
          weight: 900
    - family: Pretendard
      fonts:
        - asset: assets/font/Pretendard-Thin.ttf
          weight: 100
        - asset: assets/font/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Pretendard-Light.ttf
          weight: 300
        - asset: assets/font/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/font/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/font/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/font/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/font/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Pretendard-Black.ttf
          weight: 900

icons_launcher:
  image_path: 'assets/icon.png'
  platforms:
    web:
      image_path: 'assets/icon.png'
